name: Validate SCB skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install pytest==8.3.5 PyYAML==6.0.2
      - name: Validate skill files without SCB API calls
        run: python -m pytest -q tests/test_scb_skill.py
